    <title>Tienda Virtual</title>
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('lyberate_api_offline_cache');
          if (raw) {
            var data = JSON.parse(raw);
            var s = data && data.settings;
            if (s) {
              var title = (s.storeName || s.seoTitle || '').trim();
              if (title) {
                document.title = title;
                var metaTitle = document.getElementById('app-title-meta');
                if (metaTitle) metaTitle.setAttribute('content', s.storeName ? (s.storeName.length > 12 ? s.storeName.slice(0, 12) : s.storeName) : title);
              }
              var icon = s.appIconUrl || s.logoUrl;
              if (icon) {
                var touchIcon = document.getElementById('app-touch-icon');
                if (touchIcon) touchIcon.setAttribute('href', icon);
              }
            }
          }
        } catch(e) {}
      })();
    </script>

  <!--
    ┌─────────────────────────────────────────────────────────────────────────┐
    │  SEO PROXY REDIRECT SCRIPT                                              │
    │  Detecta URLs limpias de producto (/product/slug) y redirige           │
    │  al hash route (/#/product/slug) que usa React HashRouter.             │
    │                                                                         │
    │  Flujo:                                                                 │
    │  1. Bot WhatsApp → .htaccess → seo-proxy.php → OG tags ✅             │
    │  2. Humano → /product/slug → index.html → ESTE SCRIPT redirige         │
    │     a /#/product/slug → React carga producto correcto ✅               │
    └─────────────────────────────────────────────────────────────────────────┘
  -->
  <script>
    (function() {
      var path = window.location.pathname;
      var match = path.match(/^\/product\/(.+)$/);
      if (match && !window.location.hash) {
        // Redirigir de /product/SLUG → /#/product/SLUG sin agregar al historial
        window.location.replace('/#/product/' + match[1]);
      }
    })();
  </script>
