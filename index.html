    <style>
      :root {
        --font-main: 'Inter', sans-serif;
      }
      body {
        background-color: #F2F2F7;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-y: none;
        /* Evita selección de texto para parecer App Nativa */
        -webkit-user-select: none; 
        user-select: none;
      }
      .dark body {
        background-color: #000000;
      }
      
      /* Permitir selección solo en inputs y textos largos */
      input, textarea, .prose {
          -webkit-user-select: text;
          user-select: text;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .glass-panel {
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.18);
      }
      .dark .glass-panel {
        background: rgba(30, 30, 30, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      
      /* Animations */
      .animate-fade-in { animation: fadeIn 0.3s ease-out; }
      .animate-slide-in-right { animation: slideInRight 0.3s ease-out; }
      .animate-slide-up { animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
      .animate-pulse-slow { animation: pulseSlow 10s infinite alternate; }
      
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
      @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      @keyframes pulseSlow { from { transform: scale(1.0); } to { transform: scale(1.1); } }
      @keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(200%); } }
      @keyframes scanLine { 
        0% { transform: translateY(-50px); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateY(50px); opacity: 0; }
      }
      .animate-scan-line { animation: scanLine 2s linear infinite; }

      /* iOS PWA Safe Area Insets (Notch, Dynamic Island y Home Indicator) */
      :root {
        --safe-area-top: env(safe-area-inset-top, 0px);
        --safe-area-bottom: env(safe-area-inset-bottom, 0px);
        --safe-area-left: env(safe-area-inset-left, 0px);
        --safe-area-right: env(safe-area-inset-right, 0px);
      }

      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px) !important; }
      .pt-safe { padding-top: env(safe-area-inset-top, 0px) !important; }
      .pl-safe { padding-left: env(safe-area-inset-left, 0px) !important; }
      .pr-safe { padding-right: env(safe-area-inset-right, 0px) !important; }

      /* Cabeceras fijas en iOS PWA con holgura debajo del notch y la hora */
      .header-safe {
        padding-top: calc(env(safe-area-inset-top, 0px) + 0.75rem) !important;
      }

      /* Cajón lateral / Drawer móvil en iOS PWA */
      .sidebar-safe-top {
        padding-top: calc(env(safe-area-inset-top, 0px) + 0.75rem) !important;
      }
      .sidebar-safe-bottom {
        padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 1rem) !important;
      }
    </style>
  <!--
    ┌─────────────────────────────────────────────────────────────────────────┐
    │  SEO PROXY REDIRECT SCRIPT                                              │
    │  Detecta URLs limpias de producto (/product/slug) y redirige           │
    │  al hash route (/#/product/slug) que usa React HashRouter.             │
    │                                                                         │
    │  Flujo:                                                                 │
    │  1. Bot WhatsApp → .htaccess → seo-proxy.php → OG tags ✅             │
    │  2. Humano → /product/slug → index.html → ESTE SCRIPT redirige         │
    │     a /#/product/slug → React carga producto correcto ✅               │
    └─────────────────────────────────────────────────────────────────────────┘
  -->
  <script>
    (function() {
      var path = window.location.pathname;
      var match = path.match(/^\/product\/(.+)$/);
      if (match && !window.location.hash) {
        // Redirigir de /product/SLUG → /#/product/SLUG sin agregar al historial
        window.location.replace('/#/product/' + match[1]);
      }
    })();
  </script>
