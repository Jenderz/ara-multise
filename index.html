    <title>Tienda Oficial</title>
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('lyberate_api_offline_cache');
          if (raw) {
            var data = JSON.parse(raw);
            var s = data && data.settings;
            if (s) {
              var storeName = (s.storeName || '').trim();
              var seoTitle = (s.seoTitle || '').trim();
              if (seoTitle.indexOf('Tienda Virtual | E-commerce') !== -1 || seoTitle.indexOf('Tienda Virtual') !== -1) {
                seoTitle = '';
              }
              var finalTitle = storeName ? (seoTitle ? storeName + ' | ' + seoTitle : storeName + ' | Catálogo Online Oficial') : (seoTitle || 'Tienda Oficial');

              document.title = finalTitle;
              var metaTitle = document.getElementById('app-title-meta');
              if (metaTitle) metaTitle.setAttribute('content', storeName ? (storeName.length > 12 ? storeName.slice(0, 12) : storeName) : finalTitle);

              var ogTitle = document.getElementById('og-title');
              if (ogTitle) ogTitle.setAttribute('content', finalTitle);

              var ogSiteName = document.getElementById('og-site-name');
              if (ogSiteName && storeName) ogSiteName.setAttribute('content', storeName);

              var icon = s.appIconUrl || s.logoUrl || '/favicon.png';
              if (icon) {
                var touchIcon = document.getElementById('app-touch-icon');
                if (touchIcon) touchIcon.setAttribute('href', icon);
                var favIco = document.getElementById('app-favicon-ico');
                if (favIco) favIco.setAttribute('href', icon);
                var favPng = document.getElementById('app-favicon-png');
                if (favPng) favPng.setAttribute('href', icon);
                var ogImage = document.getElementById('og-image');
                if (ogImage) ogImage.setAttribute('content', icon);
              }
            }
          }
        } catch(e) {}
      })();
    </script>

  <!--
    ┌─────────────────────────────────────────────────────────────────────────┐
    │  SEO PROXY REDIRECT SCRIPT                                              │
    │  Detecta URLs limpias (/product/slug, /shop, /about) y redirige         │
    │  al hash route correspondiente que usa React HashRouter.               │
    └─────────────────────────────────────────────────────────────────────────┘
  -->
  <script>
    (function() {
      var path = window.location.pathname;
      if (!window.location.hash) {
        var prodMatch = path.match(/^\/product\/(.+)$/);
        if (prodMatch) {
          window.location.replace('/#/product/' + prodMatch[1]);
        } else if (path === '/shop' || path === '/shop/') {
          window.location.replace('/#/shop');
        } else if (path === '/about' || path === '/about/') {
          window.location.replace('/#/about');
        }
      }
    })();
  </script>

  <style>
    /* Preloader Minimalista - Tecnología Lyberate */
    .preloader-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
      z-index: 99999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .dark .preloader-screen {
      background-color: #000000;
    }

    .preloader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .lyberate-svg {
      width: 84px;
      height: 84px;
      display: block;
      filter: drop-shadow(0 10px 18px rgba(126, 34, 206, 0.12));
      animation: gentle-float 3.5s ease-in-out infinite alternate;
    }

    .light-sweep-group {
      animation: shimmer-glide 3.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .branding {
      margin-top: 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .sub-brand {
      font-size: 7.5px;
      font-weight: 600;
      letter-spacing: 0.55em;
      text-transform: uppercase;
      color: #9333ea;
      margin-bottom: 3px;
      padding-left: 0.55em;
      opacity: 0.85;
    }

    .main-brand {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #0f172a;
      padding-left: 0.35em;
    }

    .dark .main-brand {
      color: #f8fafc;
    }

    .progress-track {
      width: 64px;
      height: 1.5px;
      background: #f1f5f9;
      border-radius: 99px;
      margin-top: 18px;
      position: relative;
      overflow: hidden;
    }

    .dark .progress-track {
      background: #1e293b;
    }

    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, transparent, #c084fc, #7e22ce, transparent);
      border-radius: 99px;
      animation: track-runner 1.6s ease-in-out infinite;
    }

    @keyframes gentle-float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-5px); }
    }

    @keyframes shimmer-glide {
      0% { transform: translate(-2200px, -2200px); }
      30%, 100% { transform: translate(2200px, 2200px); }
    }

    @keyframes track-runner {
      0% { left: -45%; }
      100% { left: 100%; }
    }
  </style>

</head>

    <script>
      (function() {
        function dismissPreloader() {
          var p = document.getElementById('preloader');
          if (p && !p.classList.contains('dismissed')) {
            p.classList.add('dismissed');
            p.style.opacity = '0';
            p.style.visibility = 'hidden';
            setTimeout(function() {
              if (p && p.parentNode) p.parentNode.removeChild(p);
            }, 550);
          }
        }
        window.addEventListener('load', function() {
          setTimeout(dismissPreloader, 400);
        });
      })();
