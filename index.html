    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tienda" id="app-title-meta">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3081/3081559.png" id="app-touch-icon">

    <!-- Open Graph Fallbacks (WhatsApp, Facebook, Twitter) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tienda Oficial" id="og-site-name" />
    <meta property="og:title" content="Catálogo Online Oficial" id="og-title" />
    <meta property="og:description" content="Explora nuestro catálogo de productos, novedades y ofertas exclusivas." id="og-desc" />
    <meta property="og:image" content="/icon.png" id="og-image" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />

    <title>Tienda Oficial</title>
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('lyberate_api_offline_cache');
          if (raw) {
            var data = JSON.parse(raw);
            var s = data && data.settings;
            if (s) {
              var storeName = (s.storeName || '').trim();
              var seoTitle = (s.seoTitle || '').trim();
              if (seoTitle.indexOf('Tienda Virtual | E-commerce') !== -1 || seoTitle.indexOf('Tienda Virtual') !== -1) {
                seoTitle = '';
              }
              var finalTitle = storeName ? (seoTitle ? storeName + ' | ' + seoTitle : storeName + ' | Catálogo Online Oficial') : (seoTitle || 'Tienda Oficial');

              document.title = finalTitle;
              var metaTitle = document.getElementById('app-title-meta');
              if (metaTitle) metaTitle.setAttribute('content', storeName ? (storeName.length > 12 ? storeName.slice(0, 12) : storeName) : finalTitle);

              var ogTitle = document.getElementById('og-title');
              if (ogTitle) ogTitle.setAttribute('content', finalTitle);

              var ogSiteName = document.getElementById('og-site-name');
              if (ogSiteName && storeName) ogSiteName.setAttribute('content', storeName);

              var icon = s.appIconUrl || s.logoUrl || '/icon.png';
              if (icon) {
                var touchIcon = document.getElementById('app-touch-icon');
                if (touchIcon) touchIcon.setAttribute('href', icon);
                var ogImage = document.getElementById('og-image');
                if (ogImage) ogImage.setAttribute('content', icon);
              }
            }
          }
        } catch(e) {}
      })();
    </script>
    <!-- Google Fonts Import -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lato:wght@300;400;700&family=Montserrat:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!--
    ┌─────────────────────────────────────────────────────────────────────────┐
    │  SEO PROXY REDIRECT SCRIPT                                              │
    │  Detecta URLs limpias de producto (/product/slug) y redirige           │
    │  al hash route (/#/product/slug) que usa React HashRouter.             │
    │                                                                         │
    │  Flujo:                                                                 │
    │  1. Bot WhatsApp → .htaccess → seo-proxy.php → OG tags ✅             │
    │  2. Humano → /product/slug → index.html → ESTE SCRIPT redirige         │
    │     a /#/product/slug → React carga producto correcto ✅               │
    └─────────────────────────────────────────────────────────────────────────┘
  -->
  <script>
    (function() {
      var path = window.location.pathname;
      var match = path.match(/^\/product\/(.+)$/);
      if (match && !window.location.hash) {
        // Redirigir de /product/SLUG → /#/product/SLUG sin agregar al historial
        window.location.replace('/#/product/' + match[1]);
      }
    })();
  </script>
