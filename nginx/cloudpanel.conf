# ══════════════════════════════════════════════════════════════════════════════
# CLOUDPANEL VHOST NGINX CONFIGURATION - ARA E-COMMERCE MULTISEDE
# ══════════════════════════════════════════════════════════════════════════════
# Instrucciones de instalación en CloudPanel:
# 1. En CloudPanel ve a "Sites" -> Tu Dominio -> Pestaña "Vhost".
# 2. Reemplaza TODO el contenido con esta configuración.
# 3. Haz clic en "Save" (Guardar).
# ══════════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name {{domain_name}};
    
    {{ssl_certificate_key}}
    {{ssl_certificate}}

    # Directorio raíz del sitio inyectado por CloudPanel
    {{root}}
    index index.html index.php;

    {{nginx_access_log}}
    {{nginx_error_log}}

    if ($scheme != "https") {
        return 301 https://$host$request_uri;
    }

    # Autenticación básica si se activa en CloudPanel
    {{basic_auth}}

    # Tamaño máximo de subida para imágenes y catálogos
    client_max_body_size 64M;

    # Compresión GZIP de alto rendimiento
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ══════════════════════════════════════════════════════════════════
    # 1. SEGURIDAD Y ENCABEZADOS HTTP
    # ══════════════════════════════════════════════════════════════════
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ══════════════════════════════════════════════════════════════════
    # 2. SEO PRE-RENDERER: BOTS DE REDES SOCIALES (WhatsApp, FB, etc.)
    # ══════════════════════════════════════════════════════════════════
    # Previsualización dinámica de producto en redes sociales
    location ~* ^/product/(.+)$ {
        if ($http_user_agent ~* (facebookexternalhit|Facebot|WhatsApp|Twitterbot|Slackbot|TelegramBot|LinkedInBot|Discordbot|Pinterestbot|Googlebot|bingbot|Applebot|Embedly|vkShare|outbrain)) {
            rewrite ^/product/(.+)$ /seo-proxy.php?slug=$1 last;
        }
        try_files $uri $uri/ /index.html;
    }

    # Previsualización dinámica de la tienda en redes sociales
    location = / {
        if ($http_user_agent ~* (facebookexternalhit|Facebot|WhatsApp|Twitterbot|Slackbot|TelegramBot|LinkedInBot|Discordbot|Pinterestbot|Googlebot|bingbot|Applebot|Embedly|vkShare|outbrain)) {
            rewrite ^ /seo-proxy.php?mode=store last;
        }
        try_files $uri /index.html;
    }

    # ══════════════════════════════════════════════════════════════════
    # 2.5 FAVICON E ICONOS DINÁMICOS DE MARCA BLANCA
    # ══════════════════════════════════════════════════════════════════
    location ~* ^/(favicon\.ico|favicon\.png|apple-touch-icon\.png|apple-touch-icon-precomposed\.png)$ {
        rewrite ^/(.+)$ /favicon.php?type=$1 last;
    }

    location = /robots.txt {
        rewrite ^ /robots.php last;
    }

    location = /sitemap.xml {
        rewrite ^ /sitemap.php last;
    }

    # ══════════════════════════════════════════════════════════════════
    # 3. MANIFEST PWA DINÁMICO
    # ══════════════════════════════════════════════════════════════════
    location = /manifest.json {
        rewrite ^ /manifest.json.php last;
    }

    # ══════════════════════════════════════════════════════════════════
    # 4. ENRUTAMIENTO SPA (Vite / React)
    # ══════════════════════════════════════════════════════════════════
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ══════════════════════════════════════════════════════════════════
    # 5. CONTROL DE CACHÉ PARA SERVICE WORKER Y ACTIVOS VITE
    # ══════════════════════════════════════════════════════════════════
    # Service Worker, Manifest e index.html: NUNCA CACHEAR (Prioridad alta)
    location ~* (sw\.js|manifest\.json|index\.html)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Activos estáticos con hash único de Vite: Cachear 1 año inmutable
    location ~* \.(ico|pdf|flv|jpg|jpeg|png|gif|webp|js|css|swf|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # ══════════════════════════════════════════════════════════════════
    # 6. EJECUCIÓN PHP-FPM (FastCGI) - CLOUDPANEL V2
    # ══════════════════════════════════════════════════════════════════
    location ~ \.php$ {
        try_files $fastcgi_script_name =404;

        include fastcgi_params;
        fastcgi_intercept_errors off;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_hide_header X-Powered-By;

        # Tiempos de espera para transacciones de catálogo e importación
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;

        # Procesador PHP-FPM gestionado dinámicamente por CloudPanel
        fastcgi_pass 127.0.0.1:{{php_fpm_port}};
        fastcgi_param PHP_VALUE "{{php_settings}}";
    }

    # ══════════════════════════════════════════════════════════════════
    # 7. REGLAS ESTRICTAS DE SEGURIDAD
    # ══════════════════════════════════════════════════════════════════
    # Proteger código interno y credenciales de BD
    location ^~ /lib/ {
        deny all;
        return 404;
    }

    # Proteger carpeta de subidas: NUNCA permitir ejecución de PHP
    location ^~ /uploads/ {
        location ~ \.php$ {
            deny all;
            return 403;
        }
    }

    # Proteger archivos ocultos (.env, .git, etc.)
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Proteger archivos de configuración y dependencias
    location ~* (composer\.json|composer\.lock|package\.json|package-lock\.json|\.env|\.git|tsconfig\.json)$ {
        deny all;
        return 404;
    }
}
