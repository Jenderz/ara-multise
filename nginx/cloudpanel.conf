# ══════════════════════════════════════════════════════════════════════════════
# CLOUDPANEL VHOST NGINX CONFIGURATION - ARA E-COMMERCE MULTISEDE
# ══════════════════════════════════════════════════════════════════════════════
# Instrucciones de instalación en CloudPanel:
# 1. En CloudPanel ve a "Sites" -> Tu Dominio -> Pestaña "Vhost".
# 2. Reemplaza el bloque 'server { ... }' con este contenido.
# 3. Haz clic en "Save".
# ══════════════════════════════════════════════════════════════════════════════

# Detección de Bots de Redes Sociales para SEO Pre-rendering (Open Graph)
map $http_user_agent $is_social_bot {
    default 0;
    ~*(facebookexternalhit|Facebot|WhatsApp|Twitterbot|Slackbot|TelegramBot|LinkedInBot|Discordbot|Pinterestbot|Googlebot|bingbot|Applebot|Embedly|vkShare|outbrain) 1;
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name {{domain_name}};
    
    {{ssl_certificate_key}}
    {{ssl_certificate}}

    # Directorio raíz del sitio (debe apuntar a la carpeta con index.html y api.php)
    root {{root_directory}};
    index index.html index.php;

    # Tamaño máximo de subida para imágenes y catálogos
    client_max_body_size 64M;

    # Compresión GZIP de alto rendimiento
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ══════════════════════════════════════════════════════════════════
    # 1. SEGURIDAD Y ENCABEZADOS HTTP
    # ══════════════════════════════════════════════════════════════════
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ══════════════════════════════════════════════════════════════════
    # 2. SEO PRE-RENDERER: BOTS DE REDES SOCIALES (WhatsApp, FB, etc.)
    # ══════════════════════════════════════════════════════════════════
    # Previsualización dinámica de producto en redes sociales
    location ~* ^/product/(.+)$ {
        if ($is_social_bot = 1) {
            rewrite ^/product/(.+)$ /seo-proxy.php?slug=$1 last;
        }
        try_files $uri $uri/ /index.html;
    }

    # Previsualización dinámica de la tienda en redes sociales
    location = / {
        if ($is_social_bot = 1) {
            rewrite ^ /seo-proxy.php?mode=store last;
        }
        try_files $uri /index.html;
    }

    # ══════════════════════════════════════════════════════════════════
    # 3. MANIFEST PWA DINÁMICO
    # ══════════════════════════════════════════════════════════════════
    location = /manifest.json {
        rewrite ^ /manifest.json.php last;
    }

    # ══════════════════════════════════════════════════════════════════
    # 4. ENRUTAMIENTO SPA (Vite / React)
    # ══════════════════════════════════════════════════════════════════
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ══════════════════════════════════════════════════════════════════
    # 5. CONTROL DE CACHÉ PARA SERVICE WORKER Y ACTIVOS VITE
    # ══════════════════════════════════════════════════════════════════
    # Activos estáticos con hash único de Vite: Cachear 1 año inmutable
    location ~* \.(ico|pdf|flv|jpg|jpeg|png|gif|webp|js|css|swf|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Service Worker, Manifest e index.html: NUNCA CACHEAR
    # Esencial para que las actualizaciones se apliquen de inmediato
    location ~* (sw\.js|manifest\.json|manifest\.json\.php|index\.html)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
    }

    # ══════════════════════════════════════════════════════════════════
    # 6. EJECUCIÓN PHP-FPM (FastCGI)
    # ══════════════════════════════════════════════════════════════════
    location ~ \.php$ {
        # Evita que peticiones a archivos PHP inexistentes caigan en index.html
        try_files $fastcgi_script_name =404;

        include fastcgi_params;
        fastcgi_pass $fastcgi_pass;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_hide_header X-Powered-By;

        # Tiempos de espera y buffers para transacciones de catálogo e importación
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
    }

    # ══════════════════════════════════════════════════════════════════
    # 7. REGLAS ESTRICTAS DE SEGURIDAD
    # ══════════════════════════════════════════════════════════════════
    # Proteger código interno y credenciales de BD
    location ^~ /lib/ {
        deny all;
        return 404;
    }

    # Proteger carpeta de subidas: NUNCA permitir ejecución de PHP
    location ^~ /uploads/ {
        location ~ \.php$ {
            deny all;
            return 403;
        }
    }

    # Proteger archivos ocultos (.env, .git, etc.)
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Proteger archivos de configuración y dependencias
    location ~* (composer\.json|composer\.lock|package\.json|package-lock\.json|\.env|\.git|tsconfig\.json)$ {
        deny all;
        return 404;
    }
}
