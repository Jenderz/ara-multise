# ══════════════════════════════════════════════════════════════════════════════
# NGINX STANDALONE CONFIGURATION - ARA E-COMMERCE MULTISEDE
# ══════════════════════════════════════════════════════════════════════════════
# Uso: En /etc/nginx/sites-available/tudominio.com
# Ajusta 'server_name', 'root' y 'fastcgi_pass' según tu entorno.
# ══════════════════════════════════════════════════════════════════════════════

map $http_user_agent $is_social_bot {
    default 0;
    ~*(facebookexternalhit|Facebot|WhatsApp|Twitterbot|Slackbot|TelegramBot|LinkedInBot|Discordbot|Pinterestbot|Googlebot|bingbot|Applebot|Embedly|vkShare|outbrain) 1;
}

server {
    listen 80;
    server_name tudominio.com www.tudominio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tudominio.com www.tudominio.com;

    # Certificados SSL (ej. Let's Encrypt / Certbot)
    # ssl_certificate /etc/letsencrypt/live/tudominio.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/tudominio.com/privkey.pem;

    root /var/www/tudominio.com/dist;
    index index.html index.php;

    client_max_body_size 64M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SEO Pre-rendering para bots de redes sociales
    location ~* ^/product/(.+)$ {
        if ($is_social_bot = 1) {
            rewrite ^/product/(.+)$ /seo-proxy.php?slug=$1 last;
        }
        try_files $uri $uri/ /index.html;
    }

    location = / {
        if ($is_social_bot = 1) {
            rewrite ^ /seo-proxy.php?mode=store last;
        }
        try_files $uri /index.html;
    }

    # Manifest PWA
    location = /manifest.json {
        rewrite ^ /manifest.json.php last;
    }

    # Enrutamiento SPA React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché inmutable para estáticos de Vite
    location ~* \.(ico|pdf|flv|jpg|jpeg|png|gif|webp|js|css|swf|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Anti-caché estricto para Service Worker e Index
    location ~* (sw\.js|manifest\.json|manifest\.json\.php|index\.html)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
    }

    # Procesador PHP-FPM
    location ~ \.php$ {
        try_files $fastcgi_script_name =404;
        include fastcgi_params;
        # Ajusta según tu socket o puerto (ej: php8.2-fpm o php8.3-fpm)
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    # Seguridad
    location ^~ /lib/ {
        deny all;
        return 404;
    }

    location ^~ /uploads/ {
        location ~ \.php$ {
            deny all;
            return 403;
        }
    }

    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location ~* (composer\.json|package\.json|package-lock\.json|\.env|\.git|tsconfig\.json)$ {
        deny all;
        return 404;
    }
}
